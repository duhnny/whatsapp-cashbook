services:
  cashbook:
    image: localhost/whatsapp-cashbook
    environment:
      ENV_FILE: /run/secrets/whatsapp-cashbook-env
    secrets:
      - whatsapp-cashbook-env
    networks:
      - db
      - whatsapp
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.2'
      labels:
        # traefik config
        - 'traefik.enable=true'

        # api
        - "traefik.http.routers.${DOCKER_STACK_NAME}_cashbook.rule=Host(`$BACKEND_HOST`)"
        - "traefik.http.routers.${DOCKER_STACK_NAME}_cashbook.entrypoints=websecure"
        - "traefik.http.routers.${DOCKER_STACK_NAME}_cashbook.tls=true"
        - "traefik.http.routers.${DOCKER_STACK_NAME}_cashbook.tls.certresolver=leresolver"
        - "traefik.http.routers.${DOCKER_STACK_NAME}_cashbook.tls.domains.main=$BACKEND_HOST"
        - "traefik.http.routers.${DOCKER_STACK_NAME}_cashbook.service=${DOCKER_STACK_NAME}_cashbook"
        - "traefik.http.services.${DOCKER_STACK_NAME}_cashbook.loadbalancer.server.port=${PORT}"

secrets:
  whatsapp-cashbook-env:
    file: ./.env

networks:
  db:
    external: true
    name: ${DB_NETWORK}
  whatsapp:
    external: true
    name: ${WHATSAPP_NETWORK}
