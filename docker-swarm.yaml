services:
  cashbook:
    image: localhost/whatsapp-cashbook
    environment:
      ENV_FILE: /run/secrets/whatsapp-cashbook-env
    secrets:
      - whatsapp-cashbook-env
    networks:
      - db
      - whatsapp
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.2'


secrets:
  whatsapp-cashbook-env:
    file: ./.env

networks:
  db:
    external: true
    name: ${DB_NETWORK}
  whatsapp:
    external: true
    name: ${WHATSAPP_NETWORK}
